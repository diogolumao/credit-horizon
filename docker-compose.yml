version: '3.8'

services:
  credit-horizon:
    build: .
    container_name: credit-horizon
    restart: always
    environment:
      - TZ=America/Sao_Paulo 
    expose:
      - "8501" 
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - rede_interna

networks:
  rede_interna:
    external: true